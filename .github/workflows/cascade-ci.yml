name: Cascade CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run test:content
      - run: node --test tests/production-contract.test.mjs tests/infrastructure/cascade-n8n.test.mjs
      - run: npm run test:platform-safety
      - run: node scripts/check-n8n-workflows.mjs
      - run: node scripts/audit/scan-secrets.mjs
      - run: node scripts/audit/check-edge-auth.mjs
      # SPEC-06 section 6: the Concierge suites run here too. They were written and kept green by hand
      # while CI covered only _shared and the two heartbeats, so a voice or booking regression could
      # reach a review unflagged. --allow-env is what draft.test.ts needs (it reads CASCADE_GEMINI_MODEL
      # at import time); type checking stays ON, so a dead Flow step fails the build.
      - run: deno test --no-lock --node-modules-dir=auto --allow-env supabase/functions/_shared/*.test.ts supabase/functions/job-heartbeat-monitor/index.test.ts supabase/functions/job-heartbeat-liveness/index.test.ts supabase/functions/messenger-concierge/ supabase/functions/telegram-cassy/ supabase/functions/upload-booking-receipt/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1 --project=desktop

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: node scripts/ci/verify-supabase-baseline.mjs
