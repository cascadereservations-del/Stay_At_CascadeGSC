name: cascade-n8n

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
    container_name: cascade-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CASCADE_N8N_DB_NAME:?required}
      POSTGRES_USER: ${CASCADE_N8N_DB_USER:?required}
      POSTGRES_PASSWORD: ${CASCADE_N8N_DB_PASSWORD:?required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cascade_postgres_data:/var/lib/postgresql/data
    networks:
      - cascade_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  n8n:
    image: n8nio/n8n:2.37.10@sha256:848166b4051fd4251869f48c18455bddff922f04cb2f2676929463ba973dbde2
    container_name: cascade-n8n-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${CASCADE_N8N_DB_NAME:?required}
      DB_POSTGRESDB_USER: ${CASCADE_N8N_DB_USER:?required}
      DB_POSTGRESDB_PASSWORD: ${CASCADE_N8N_DB_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${CASCADE_N8N_ENCRYPTION_KEY:?required}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${CASCADE_N8N_USER_MANAGEMENT_JWT_SECRET:?required}
      N8N_HOST: ${CASCADE_N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${CASCADE_N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${CASCADE_N8N_EDITOR_BASE_URL:-http://localhost:5679}
      N8N_WEBHOOK_URL: ${CASCADE_N8N_WEBHOOK_URL:-http://localhost:5679/}
      N8N_PROXY_HOPS: ${CASCADE_N8N_PROXY_HOPS:-0}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_DISABLED_MODULES: mcp
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 5
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_RUNNERS_MODE: internal
      N8N_NATIVE_PYTHON_RUNNER: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      EXECUTIONS_TIMEOUT: 900
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:${CASCADE_N8N_BIND_PORT:-5679}:5678"
    volumes:
      - cascade_n8n_data:/home/node/.n8n
      - /opt/cascade/n8n/files:/files
    networks:
      - cascade_internal
      - cascade_egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 1536m
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node/.cache:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  cascade_internal:
    name: cascade_n8n_internal
    internal: true
  cascade_egress:
    name: cascade_n8n_egress

volumes:
  cascade_n8n_data:
    name: cascade_n8n_data
  cascade_postgres_data:
    name: cascade_n8n_postgres_data
